<!-- src/app/features/students/components/student-list/student-list.component.html -->
<div class="container">
    <div class="header">
      <h1>Liste des étudiants</h1>
      <button mat-raised-button color="primary" routerLink="new">
        <mat-icon>add</mat-icon>
        Ajouter un étudiant
      </button>
    </div>
  
    <mat-card>
      <mat-card-content>
        <table mat-table [dataSource]="students$ | async" class="mat-elevation-z8">
          <!-- ID Column -->
          <ng-container matColumnDef="studentId">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let student">{{ student.studentId }}</td>
          </ng-container>
  
          <!-- First Name Column -->
          <ng-container matColumnDef="firstName">
            <th mat-header-cell *matHeaderCellDef>Prénom</th>
            <td mat-cell *matCellDef="let student">{{ student.firstName }}</td>
          </ng-container>
  
          <!-- Last Name Column -->
          <ng-container matColumnDef="lastName">
            <th mat-header-cell *matHeaderCellDef>Nom</th>
            <td mat-cell *matCellDef="let student">{{ student.lastName }}</td>
          </ng-container>
  
          <!-- Promo Column -->
          <ng-container matColumnDef="promo">
            <th mat-header-cell *matHeaderCellDef>Promotion</th>
            <td mat-cell *matCellDef="let student">{{ student.promo }}</td>
          </ng-container>
  
          <!-- Formation Column -->
          <ng-container matColumnDef="currentFormation">
            <th mat-header-cell *matHeaderCellDef>Formation</th>
            <td mat-cell *matCellDef="let student">
              {{ student.currentFormation?.name || 'Aucune' }}
            </td>
          </ng-container>
  
          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let student">
              <button mat-icon-button [routerLink]="[student.id]">
                <mat-icon>visibility</mat-icon>
              </button>
              <button mat-icon-button [routerLink]="[student.id, 'edit']">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button (click)="deleteStudent(student.id)">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
  
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
      </mat-card-content>
    </mat-card>
  </div>
